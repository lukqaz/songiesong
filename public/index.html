<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Song Guessr &mdash; Guess the song</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="layout">

    <!-- Left sidebar -->
    <aside class="sidebar sidebar-left">

      <button
        class="side-btn settings-btn"
        id="settings-btn"
        type="button"
        aria-label="Settings"
        data-i18n="settings"
      >
        &#9881; Settings
      </button>

      <div class="settings-panel" id="settings-panel" hidden>
        <div class="settings-panel-header">
          <span data-i18n="settings">Settings</span>

          <button
            class="settings-close"
            id="settings-close"
            type="button"
            aria-label="Close settings"
            data-i18n-aria-label="close"
          >
            &times;
          </button>
        </div>

        <div class="language-setting">
          <p class="setting-label" data-i18n="language">Language</p>

          <div class="language-buttons">
            <button
              type="button"
              class="language-btn"
              data-language="en"
            >
              English
            </button>

            <button
              type="button"
              class="language-btn"
              data-language="de"
            >
              Deutsch
            </button>
          </div>
        </div>
      </div>

      <div class="pill-stack" id="difficulty-stack"></div>

      <button class="side-btn" id="reroll-btn">
        &#8635; <span data-i18n="newSong">New Song</span>
      </button>

      <button class="side-btn" id="filters-btn">
        &#9881; <span data-i18n="filter">Filter</span>
      </button>

      <button class="side-btn" id="feedback-btn">
        &#128172; <span data-i18n="feedback">Feedback</span>
      </button>

    </aside>

    <!-- Center: player -->
    <main class="board">

      <header class="board-header">
        <span class="wordmark">Song Guessr</span>
        <span class="mode-label" id="mode-label" data-i18n="normal">Normal</span>
      </header>

      <div class="pill-row" id="difficulty-pills"></div>

      <div class="stage-track" id="stage-track"></div>

      <div class="player">
        <button
          class="play-btn"
          id="play-btn"
          aria-label="Play snippet"
          data-i18n-aria-label="playSnippet"
        >
          <svg id="play-icon" viewBox="0 0 24 24" fill="none">
            <path
              d="M8 5v14l11-7-11-7z"
              fill="currentColor"
            />
          </svg>

          <svg
            id="pause-icon"
            viewBox="0 0 24 24"
            fill="none"
            style="display:none"
          >
            <rect x="6" y="5" width="4" height="14" fill="currentColor"/>
            <rect x="14" y="5" width="4" height="14" fill="currentColor"/>
          </svg>
        </button>

        <span class="stage-time" id="stage-time">0.1s</span>
      </div>

      <div class="attempts" id="attempts-row"></div>

      <form class="guess-form" id="guess-form" autocomplete="off">
        <div class="input-wrap">
          <input
            type="text"
            id="guess-input"
            placeholder="Search songs..."
            aria-label="Guess the song"
            data-i18n-placeholder="searchSongs"
            data-i18n-aria-label="guessSong"
          />

          <ul class="suggestions" id="suggestions"></ul>
        </div>

        <button type="button" class="skip-btn" id="skip-btn">
          &#9199; <span data-i18n="skip">Skip</span>
        </button>
      </form>

      <ul class="guess-history" id="guess-history"></ul>

      <!-- Playlist indicator -->
      <div class="playlist-indicator" id="playlist-indicator">

        <div class="playlist-icon-wrap">
          <img
            id="playlist-icon"
            class="playlist-icon"
            src=""
            alt=""
            hidden
          />

          <span
            id="playlist-icon-placeholder"
            class="playlist-icon-placeholder"
          >
            &#9835;
          </span>
        </div>

        <div class="playlist-info">
          <div
            class="playlist-name"
            id="playlist-name"
          >
            Playlist
          </div>

          <div
            class="playlist-count"
            id="playlist-count"
          >
            Song Guessr
          </div>
        </div>

      </div>

      <!-- Result -->
      <div class="result-overlay" id="result" hidden>
        <div class="result-modal">

          <button
            class="result-close"
            id="result-close"
            aria-label="Close"
            data-i18n-aria-label="close"
          >
            &times;
          </button>

          <p class="result-status" id="result-status"></p>

          <img
            id="result-cover"
            class="result-cover"
            alt=""
          />

          <h2 class="result-song" id="result-song"></h2>

          <a
            id="result-link"
            class="result-link"
            href="#"
            target="_blank"
            rel="noopener"
            data-i18n="listenSpotify"
          >
            Listen on Spotify
          </a>

        </div>
      </div>

    </main>

    <!-- Right sidebar: game settings -->
    <aside class="sidebar sidebar-right">

      <section class="setting-group">
        <p class="setting-label" data-i18n="songStart">Song Start</p>

        <button
          class="wide-toggle active"
          id="start-from-begin"
          data-i18n="fromBeginning"
        >
          From beginning
        </button>

        <button
          class="wide-toggle"
          id="start-from-hook"
          title="Uses Spotify preview when available, otherwise starts from the beginning"
          data-i18n="fromHook"
        >
          Main Hook
        </button>
      </section>

      <section class="setting-group">
        <p class="setting-label" data-i18n="stages">Stages</p>
        <div class="stage-grid" id="stage-grid"></div>
      </section>

      <section class="setting-group">
        <p class="setting-label" data-i18n="volume">
          Volume <span id="volume-value">100%</span>
        </p>

        <input
          type="range"
          id="volume-slider"
          min="0"
          max="100"
          value="100"
        />
      </section>

    </aside>

  </div>

  <audio id="audio" preload="auto"></audio>

  <script src="/js/game.js"></script>
</body>
</html>
